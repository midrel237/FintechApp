spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fintech_db
    username: midrel
    password: 1913liVe#
    driver-class-name: org.postgresql.Driver

  # Configuration de JPA et Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  
  config:
    import: "optional:file:.env[.properties]"

  #   export MAIL_USERNAME=nexuscoders237@gmail.com
  #   export MAIL_PASSWORD=xxxxxxxxxxxxxxxx   (le mot de passe d'application)
  mail:
    host: smtp.gmail.com # Serveur SMTP de Gmail
    port: 587             # Port recommandé pour TLS
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true # Active le chiffrement TLS pour la sécurité
          connectiontimeout: 5000  # 5s : évite de bloquer indéfiniment si le SMTP est injoignable
          timeout: 5000
          writetimeout: 5000

